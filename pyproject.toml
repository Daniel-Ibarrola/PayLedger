[project]
name = "payledger"
version = "0.1.0"
description = "Card authorization and double-entry ledger system"
# Pinned to the newest Lambda runtime so local tests exercise the deployed interpreter.
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "aws-lambda-powertools>=3.31.1",
    "boto3>=1.35",
    "boto3-stubs[dynamodb]>=1.43.63",
    "mypy>=2.3.0",
    "pydantic>=2.9",
    "pytest>=8.3",
    "ruff>=0.6",
    "testcontainers>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src/layers` puts the shared layer package on the path the same way /opt/python
# does inside Lambda. `src/lambdas` lets tests import a handler by service name.
pythonpath = ["src/layers", "src/lambdas"]
markers = [
    "integration: needs Docker (testcontainers)",
    "e2e: runs against deployed AWS resources",
]

[tool.ruff]
line-length = 100
src = ["src/layers", "src/lambdas", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.13"
# Mirrors pytest's pythonpath so `from shared import ...` and
# `from authorization_service import ...` resolve the same way mypy will find
# them as they do at runtime / under test.
mypy_path = ["src/layers", "src/lambdas"]
files = ["src", "tests"]
strict = true
warn_unused_configs = true
# `make lint` runs `mypy .`, which overrides `files` above with the whole repo.
# infra/build/ is where the shared-layer build script (infra/scripts/) installs
# third-party packages before zipping — real .py files mypy would otherwise
# try (and fail) to type-check as part of this project.
exclude = ["^infra/build/"]
